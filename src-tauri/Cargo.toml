[package]
name = "claudeppt"
version = "0.7.0"
description = "Claude 와 대화하며 웹으로 PPT 를 짓고 PPTX 로 내보내는 작업대"
authors = ["seesun"]
license = "MIT"
edition = "2024"
rust-version = "1.99"

[lib]
# Windows 에서 bin 이름과 겹치지 않도록 _lib 를 붙인다 (cargo#8519).
name = "claudeppt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# GitHub 릴리즈의 latest.json 을 보고 새 판을 받아 깐다. 깐 뒤 다시 켜는 데 process 를 쓴다.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order — CLI 가 deck.json 을 고쳐 쓸 때 키 순서를 지킨다. 안 지키면 판 비교에 키 순서만 바뀐 줄이 섞인다
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 프로젝트 폴더 감시 — Claude 가 파일을 고치면 화면을 바로 다시 그린다 (핫 리로드).
notify = "8"
notify-debouncer-mini = "0.7"
# 이미지 생성 API (OpenAI · Gemini). 시스템 인증서 저장소 대신 rustls 로 — 회사 PC 프록시 설정과 무관하게 돈다.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# 바이트 쓰기 명령의 경로 머리글 풀기 (한글 경로)
percent-encoding = "2"
# 우클릭 메뉴의 「붙여 넣기」 — 웹뷰의 navigator.clipboard.readText 는 권한을 묻다 멈춘다
arboard = { version = "3", default-features = false }
# 팀 협업 서버 (collab.rs) — 「설정 › 협업」을 켜면 브라우저 팀원에게 화면 · 슬라이드 · 상태를 HTTP + WebSocket 으로 내준다
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query", "form"] }
# 협업 기기 열쇠를 해시로만 남긴다 (tauri 가 이미 쓰는 판)
sha2 = "0.10"
# 협업 서버 응답 압축 — 바깥 길(터널)이 느릴 때 화면 · 슬라이드 글을 줄여 보낸다
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }

[target.'cfg(windows)'.dependencies]
# claude 를 앱이 쥔 job 에 넣어, 앱이 어떻게 꺼지든(닫기 · 업데이트 설치 · 강제 종료) 함께 끈다 (claude.rs). tauri 가 이미 쓰는 판이라 새로 받는 것은 없다
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
