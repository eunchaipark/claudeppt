name: release

# v* 태그를 밀거나 Actions 에서 손으로 돌리면 Windows 설치 파일(NSIS)을 만들어 릴리즈에 올린다. main · PR 은 검사만 돈다.
# 설치된 앱은 릴리즈의 latest.json 을 보고 스스로 업데이트한다. 서명 키가 없으면 latest.json 이 안 생겨 업데이트가 끊긴다.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 2026.11.25 : 기본은 읽기만. PR(남의 코드)이 도는 check 에 쓰기 권한을 주지 않고, 릴리즈를 올리는 windows 만 쓴다
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - run: npm ci
      # Tauri 는 컴파일할 때 프런트엔드 빌드 결과를 읽으므로 먼저 빌드한다.
      - run: npm run build
      - run: cargo check
        working-directory: src-tauri
      - run: cargo test --lib
        working-directory: src-tauri

  windows:
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - run: npm ci
      # CHANGELOG.md 의 이번 판 구획이 릴리즈 노트가 되고, latest.json 을 거쳐 앱의 업데이트 알림 · 설정 화면에 보인다.
      - name: 릴리즈 노트
        id: notes
        run: node .github/scripts/release-notes.mjs
      # 2026.11.18 : 서명 키 비밀값이 아직 없다. 없으면 빌드가 서명에서 실패하므로 건너뛰고, 릴리즈는 키가 있는 PC 에서 서명해 손으로 올린다
      #              (README 「배포」). 비밀값을 등록하면 이 단계가 다시 돈다.
      - name: 서명 키 없음
        if: env.HAS_KEY != 'true'
        run: echo "::notice::TAURI_SIGNING_PRIVATE_KEY 비밀값이 없어 빌드 · 업로드를 건너뛴다"
      - uses: tauri-apps/tauri-action@v0
        if: env.HAS_KEY == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: ClaudePPT v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
