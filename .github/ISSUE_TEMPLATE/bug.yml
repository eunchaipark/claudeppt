name: 고장 알리기 · Bug report
description: 앱이 기대와 다르게 동작합니다
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 판 · Version
      description: 「설정 › 업데이트」에 보이는 번호
      placeholder: "0.7.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 · What happened
      description: 기대한 것과 실제로 일어난 것
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 일으키는 순서 · Steps to reproduce
      placeholder: |
        1. 덱을 연다
        2. ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 덧붙일 것 · Additional context
      description: 화면 그림 · 오류 글 · Windows 판 · Claude Code 판(`claude --version`)
